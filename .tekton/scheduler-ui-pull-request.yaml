apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/scheduler-ui?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "master"
    pipelinesascode.tekton.dev/pipeline: https://github.com/RedHatInsights/konflux-pipelines/raw/e0da8f2347fae1b5fd6a9113b2b5a3a3bbe4e584/pipelines/platform-ui/docker-build-run-all-tests-v2.yaml
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: scheduler-ui
    appstudio.openshift.io/component: scheduler-ui
    pipelines.appstudio.openshift.io/type: build
  name: scheduler-ui-on-pull-request
  namespace: hcc-platex-services-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/hcc-platex-services-tenant/hcc-platex-services/scheduler-ui:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: build-tools/Dockerfile
  - name: path-context
    value: .
  - name: workspace-setup-script
    value: |
      #!/bin/bash
      set -ex
      # Install npm dependencies (including Playwright)
      npm ci
      # Note: Playwright browsers are pre-installed in the playwright image
      # when the image version matches package.json version
  - name: unit-tests-script
    value: |
      #!/bin/bash
      set -ex
      npm run lint
      npm run test:e2e:check
      npm run test:e2e:config
      npm test -- --runInBand --no-cache
  - name: e2e-tests-script
    value: |
      #!/bin/bash
      set -euo pipefail
      export CI=true
      export E2E_TARGET=proxy
      # Browser traffic must go through the frontend-development-proxy, not
      # directly to Caddy's app asset port. HCC_ENV_URL belongs to the sidecars.
      export PLAYWRIGHT_BASE_URL="${PLAYWRIGHT_BASE_URL:-https://stage.foo.redhat.com:1337}"
      # Follow virtual-assistant-frontend's V2 readiness check: bounded checks
      # against the browser-facing proxy before starting SSO/Playwright.
      if ! timeout 120s bash -c '
        until curl -kfsS --connect-timeout 5 --max-time 10 \
          --output /dev/null "$PLAYWRIGHT_BASE_URL/"; do
          echo "Dev proxy not ready yet; retrying..."
          sleep 1
        done
      '; then
        echo "ERROR: Dev proxy readiness failed within 120 seconds." >&2
        getent hosts stage.foo.redhat.com || true
        exit 1
      fi
      npm run test:e2e
      npm run test:e2e:auth
  - name: run-app-script
    value: |
      #!/bin/bash
      set -ex
      # Start Caddy to serve app assets
      caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
  - name: e2e-playwright-image
    value: "mcr.microsoft.com/playwright:v1.59.1-jammy@sha256:8a0360d39d1973be506dd59002904a774f6d697d4946c94063b3fd006461c8ff"
  - name: frontend-proxy-routes-configmap
    value: "scheduler-ui-dev-proxy-caddyfile"
  - name: e2e-credentials-secret
    value: "scheduler-ui-credentials-secret"
  - name: e2e-app-port
    value: "8000"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/RedHatInsights/konflux-pipelines
      - name: revision
        value: e0da8f2347fae1b5fd6a9113b2b5a3a3bbe4e584
      - name: pathInRepo
        value: pipelines/platform-ui/docker-build-run-all-tests-v2.yaml
  taskRunSpecs:
  - pipelineTaskName: run-e2e-tests
    podTemplate:
      securityContext:
        # Make the shared workspace and proxy config writable by non-root steps.
        fsGroup: 1005770000
      hostAliases:
      - ip: "127.0.0.1"
        hostnames:
        - stage.foo.redhat.com
  - pipelineTaskName: run-unit-tests
    podTemplate:
      securityContext:
        # Match source extraction, dependency installation, and test identities.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1005770000
    stepSpecs:
    # V2 installs dependencies as a step of run-unit-tests, not a separate task.
    - name: workspace-setup
      computeResources:
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi
    - name: unit-tests
      computeResources:
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-scheduler-ui
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      metadata:
        creationTimestamp: null
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
      status: {}
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
